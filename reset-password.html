<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — Free Book Shelves</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="nav"><strong>📚 Set New Password</strong></div>

<div class="container">
  <h1>Choose a New Password</h1>
  <div id="message"></div>
  <form id="resetForm">
    <label for="password">New Password</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password" />

    <label for="confirmPassword">Confirm New Password</label>
    <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" />

    <button type="submit" class="btn btn-primary">Save New Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
const form = document.getElementById('resetForm');
const messageEl = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    messageEl.innerHTML = '<div class="status-msg status-error">Passwords don\'t match. Please try again.</div>';
    return;
  }

  const submitBtn = form.querySelector('button');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    messageEl.innerHTML = `<div class="status-msg status-error">${error.message}</div>`;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save New Password';
    return;
  }

  messageEl.innerHTML = '<div class="status-msg status-success">Password updated! Redirecting to login...</div>';
  setTimeout(() => { window.location.href = 'staff-login.html'; }, 1500);
});
</script>
</body>
</html>
