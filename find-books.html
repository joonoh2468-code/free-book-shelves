<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find a Book — Next Chapter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="has-tab-bar">

<div class="nav">
  <a href="index.html" class="nav-home" aria-label="Home">🏠</a>
  <strong>📚 Find a Book</strong>
  <span style="width:22px;"></span>
</div>

<div class="container">
  <p>Search books that are currently sitting on our shelves around town. Take a book, keep it forever. No late fees, no returns, ever.</p>

  <input type="text" id="searchInput" placeholder="Search by title or author..." aria-label="Search by title or author" />

  <div id="results">
    <p>Loading books...</p>
  </div>
</div>

<nav class="tab-bar">
  <a href="page-it-forward.html" class="tab-item">
    <span class="tab-icon">📦</span>
    <span class="tab-label">Page It Forward</span>
  </a>
  <a href="find-books.html" class="tab-item active">
    <span class="tab-icon">🔍</span>
    <span class="tab-label">Find Books</span>
  </a>
  <a href="book-request.html" class="tab-item">
    <span class="tab-icon">✉️</span>
    <span class="tab-label">Book Request</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
const resultsEl = document.getElementById('results');
const searchInput = document.getElementById('searchInput');
let shelfNames = {};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function loadShelfNames() {
  const { data, error } = await supabase.from('shelves').select('id, name');
  if (!error && data) {
    shelfNames = Object.fromEntries(data.map(s => [s.id, s.name]));
  }
}

async function search(query) {
  resultsEl.innerHTML = '<p>Searching...</p>';

  let q = supabase.from('books').select('*').eq('status', 'available').order('title');
  if (query.trim()) {
    const term = query.trim().replace(/[%_]/g, '');
    q = q.or(`title.ilike.%${term}%,author.ilike.%${term}%`);
  }

  const { data, error } = await q;

  if (error) {
    resultsEl.innerHTML = '<div class="status-msg status-error">Something went wrong loading books. Please try again.</div>';
    return;
  }
  renderResults(data);
}

function renderResults(books) {
  if (!books.length) {
    resultsEl.innerHTML = '<p>No matching books are on the shelves right now. Check back soon — new donations get added often!</p>';
    return;
  }
  resultsEl.innerHTML = books.map(b => `
    <div class="card">
      <div class="book-title">${escapeHtml(b.title)}</div>
      <div class="book-meta">${escapeHtml(b.author || 'Unknown author')}${b.categories && b.categories.length ? ' · ' + b.categories.map(escapeHtml).join(', ') : ''}${b.age_range ? ' · Ages ' + escapeHtml(b.age_range) : ''}${b.grade_range ? ' · Grades ' + escapeHtml(b.grade_range) : ''}</div>
      <div class="book-meta">📍 ${escapeHtml(shelfNames[b.shelf_id] || 'Shelf location unknown')}</div>
      <span class="stamp stamp-available">Available now</span>
    </div>
  `).join('');
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => search(searchInput.value), 300);
});

(async () => {
  await loadShelfNames();
  await search('');
})();
</script>
</body>
</html>
