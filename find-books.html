<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Book — Next Chapter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="index.html">Next Chapter</a>
  <nav class="site-nav">
    <a href="page-it-forward.html">📦 Page It Forward</a>
    <a href="find-books.html" aria-current="page">🔍 Find Books</a>
    <a href="book-request.html">📝 Book Request</a>
  </nav>
  <button class="menu-button" aria-label="Menu"><span></span><span></span></button>
</header>

<main>
  <div class="find-head">
    <div>
      <span class="eyebrow">On the shelves now</span>
      <h1 class="display">Find a <em>Book</em></h1>
      <p class="lede" style="margin-bottom:0;">Search books that are currently sitting on our shelves around town. Take a book, keep it forever. No late fees, no returns, ever.</p>
    </div>
    <label class="search-field">
      <span>🔍</span>
      <input type="search" id="book-search" placeholder="Search by title or author">
    </label>
  </div>

  <div class="card-grid-3" id="book-list">
    <p class="body">Loading books...</p>
  </div>
</main>

<div class="footer-band"></div>

<nav class="tab-bar">
  <a href="page-it-forward.html"><span class="icon">📦</span>Page It Forward</a>
  <a href="find-books.html" aria-current="page"><span class="icon">🔍</span>Find Books</a>
  <a href="book-request.html"><span class="icon">📝</span>Book Request</a>
</nav>

<style>
  .find-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 40px;
    align-items: end;
    margin-bottom: 40px;
  }
  @media (max-width: 760px) {
    .find-head { grid-template-columns: 1fr; gap: 18px; align-items: stretch; margin-bottom: 18px; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
const bookListEl = document.getElementById('book-list');
const searchInput = document.getElementById('book-search');
let shelfNames = {};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function loadShelfNames() {
  const { data, error } = await supabase.from('shelves').select('id, name');
  if (!error && data) {
    shelfNames = Object.fromEntries(data.map(s => [s.id, s.name]));
  }
}

async function search(query) {
  bookListEl.innerHTML = '<p class="body">Searching...</p>';

  let q = supabase.from('books').select('*').eq('status', 'available').order('title');
  if (query.trim()) {
    const term = query.trim().replace(/[%_]/g, '');
    q = q.or(`title.ilike.%${term}%,author.ilike.%${term}%`);
  }

  const { data, error } = await q;

  if (error) {
    bookListEl.innerHTML = '<div class="status-msg status-error">Something went wrong loading books. Please try again.</div>';
    return;
  }
  renderResults(data);
}

function renderResults(books) {
  if (!books.length) {
    bookListEl.innerHTML = '<p class="body">No matching books are on the shelves right now. Check back soon — new donations get added often!</p>';
    return;
  }
  bookListEl.innerHTML = books.map(b => {
    const meta = [
      b.author || 'Unknown author',
      b.categories && b.categories.length ? b.categories.map(escapeHtml).join(', ') : null,
      '📍 ' + (shelfNames[b.shelf_id] || 'Shelf location unknown')
    ].filter(Boolean).join(' · ');
    const tag = [
      b.age_range ? 'Ages ' + b.age_range : null,
      b.grade_range ? 'Grades ' + b.grade_range : null
    ].filter(Boolean).join(' · ');

    return `
      <div class="card">
        <div class="card-title">${escapeHtml(b.title)}</div>
        <div class="card-meta">${meta}</div>
        ${tag ? `<div class="card-tag">${escapeHtml(tag)}</div>` : ''}
      </div>
    `;
  }).join('');
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => search(searchInput.value), 300);
});

(async () => {
  await loadShelfNames();
  await search('');
})();
</script>

</body>
</html>
