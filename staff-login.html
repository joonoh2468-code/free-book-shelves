<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volunteer Login — Free Book Shelves</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="nav"><strong>📚 Volunteer Login</strong></div>

<div class="container">
  <h1>Log In</h1>
  <div id="message"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit" class="btn btn-primary">Log In</button>
  </form>

  <p style="margin-top:20px;font-size:14px;">
    Don't have an account yet? Ask your coordinator to invite you — accounts are added manually, there's no public sign-up.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
const form = document.getElementById('loginForm');
const messageEl = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const submitBtn = form.querySelector('button');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in...';

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    messageEl.innerHTML = `<div class="status-msg status-error">${error.message}</div>`;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log In';
    return;
  }

  window.location.href = 'add-book.html';
});

// If already logged in, skip straight to the staff area.
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = 'add-book.html';
})();
</script>
</body>
</html>
