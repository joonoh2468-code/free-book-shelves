<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request a Book — Next Chapter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="has-tab-bar">

<div class="nav">
  <a href="index.html" class="nav-home" aria-label="Home">🏠</a>
  <strong>✉️ Book Request</strong>
  <span style="width:22px;"></span>
</div>

<div class="container">
  <h1>Looking for a Specific Book?</h1>
  <p>Tell us what you're hoping to find and we'll try to get it onto a shelf. No promises, but we do check these regularly.</p>

  <div id="message"></div>

  <form id="requestForm">
    <label for="bookTitle">Book Title</label>
    <input type="text" id="bookTitle" required />

    <label for="bookAuthor">Author (optional)</label>
    <input type="text" id="bookAuthor" />

    <label for="notes">Anything else? (optional)</label>
    <textarea id="notes" rows="3" placeholder="e.g. for my 6-year-old, loves dinosaurs..."></textarea>

    <label for="requesterName">Your Name (optional)</label>
    <input type="text" id="requesterName" />

    <label for="requesterEmail">Your Email (optional — only if you'd like us to follow up)</label>
    <input type="email" id="requesterEmail" />

    <button type="submit" class="btn btn-primary">Submit Request</button>
  </form>
</div>

<nav class="tab-bar">
  <a href="page-it-forward.html" class="tab-item">
    <span class="tab-icon">📦</span>
    <span class="tab-label">Page It Forward</span>
  </a>
  <a href="find-books.html" class="tab-item">
    <span class="tab-icon">🔍</span>
    <span class="tab-label">Find Books</span>
  </a>
  <a href="book-request.html" class="tab-item active">
    <span class="tab-icon">✉️</span>
    <span class="tab-label">Book Request</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

const form = document.getElementById('requestForm');
const messageEl = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = form.querySelector('button');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  const payload = {
    book_title: document.getElementById('bookTitle').value.trim(),
    book_author: document.getElementById('bookAuthor').value.trim() || null,
    notes: document.getElementById('notes').value.trim() || null,
    requester_name: document.getElementById('requesterName').value.trim() || null,
    requester_email: document.getElementById('requesterEmail').value.trim() || null
  };

  const { error } = await supabase.from('book_requests').insert(payload);

  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit Request';

  if (error) {
    messageEl.innerHTML = `<div class="status-msg status-error">Could not submit: ${escapeHtml(error.message)}</div>`;
    return;
  }

  messageEl.innerHTML = '<div class="status-msg status-success">Thanks! We\'ve got your request and will keep an eye out. 📖</div>';
  form.reset();
});
</script>
</body>
</html>
